<!DOCTYPE html>
<html lang="zh-Hant" data-race-layout="landscape">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>新約讀經賽程圖</title>

  <style>
    :root {
      --bg1: #e9f7ff;
      --bg2: #fff5dc;
      --bg3: #e9ffe9;
      --ink: #243040;
      --muted: #6b7280;
      --card: rgba(255, 255, 255, 0.88);
      --line: rgba(36, 48, 64, 0.12);
      --blue: #4f8cff;
      --green: #3ac17a;
      --orange: #ffad42;
      --red: #ff6b6b;
      --gold: #f6c343;
      --gray: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 210, 92, 0.48), transparent 24%),
        radial-gradient(circle at 88% 10%, rgba(135, 206, 255, 0.48), transparent 28%),
        radial-gradient(circle at 50% 92%, rgba(102, 220, 142, 0.32), transparent 34%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 52%, var(--bg3));
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 22px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
      position: relative;
      z-index: 20;
    }

    .titleBlock {
      flex: 1 1 auto;
      min-width: 0;
      padding: 14px 18px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 18px 42px rgba(43, 73, 110, 0.14);
      backdrop-filter: blur(14px);
      overflow: hidden;
      position: relative;
    }

    .titleBlock::before {
      content: "🌱 📖 ✨";
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 22px;
      opacity: 0.45;
    }

    .eyebrow {
      margin-bottom: 6px;
      color: #4f8cff;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0;
      color: #1f3654;
      font-size: clamp(26px, 3.8vw, 48px);
      line-height: 1.05;
      letter-spacing: 0.03em;
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.8);
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
    }

    .searchPanel {
      flex: 0 0 min(360px, 42vw);
      width: min(360px, 42vw);
      position: relative;
      z-index: 40;
    }

    .searchBox {
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 26px;
      background: var(--card);
      box-shadow: 0 16px 40px rgba(43, 73, 110, 0.16);
      backdrop-filter: blur(14px);
    }

    .searchLabel {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .searchInput {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font: 900 18px/1.2 inherit;
    }

    .searchInput:focus {
      border-color: rgba(79, 140, 255, 0.7);
      box-shadow: 0 0 0 4px rgba(79, 140, 255, 0.14);
    }

    .detailCard {
      max-height: 0;
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 16px 42px rgba(43, 73, 110, 0.18);
      opacity: 0;
      overflow: hidden;
      transition:
        max-height 0.25s ease,
        opacity 0.25s ease,
        padding 0.25s ease;
    }

    .detailCard.open {
      max-height: 520px;
      padding: 16px;
      opacity: 1;
      overflow-y: auto;
    }

    .detailTitle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 22px;
      font-weight: 950;
    }

    .badge {
      flex: 0 0 auto;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(79, 140, 255, 0.12);
      color: #2f6de0;
      font-size: 13px;
      font-weight: 900;
    }

    .detailStats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      padding: 10px;
      border: 1px solid rgba(36, 48, 64, 0.08);
      border-radius: 16px;
      background: #f8fafc;
    }

    .statLabel {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .statValue {
      margin-top: 3px;
      font-size: 18px;
      font-weight: 950;
    }

    .bookList {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .bookRow {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 70px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
    }

    .bar {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .barFill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f8cff, #3ac17a);
    }

    .mapShell {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 36px;
      background:
        radial-gradient(circle at 12% 20%, rgba(255, 255, 255, 0.92) 0 3%, transparent 3.4%),
        radial-gradient(circle at 19% 25%, rgba(255, 255, 255, 0.72) 0 2.2%, transparent 2.6%),
        radial-gradient(circle at 76% 16%, rgba(255, 255, 255, 0.88) 0 3.2%, transparent 3.6%),
        linear-gradient(180deg, #8fd7ff 0%, #cdefff 34%, #d7f6be 68%, #aee48e 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.85),
        0 24px 70px rgba(43, 73, 110, 0.2);
      position: relative;
    }

    .mapShell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at 18% 78%, rgba(255, 232, 134, 0.85) 0 1.3%, transparent 1.5%),
        radial-gradient(circle at 21% 81%, rgba(255, 151, 125, 0.7) 0 1.1%, transparent 1.3%),
        radial-gradient(circle at 24% 77%, rgba(130, 210, 106, 0.75) 0 1.2%, transparent 1.4%),
        radial-gradient(circle at 72% 77%, rgba(255, 232, 134, 0.85) 0 1.2%, transparent 1.4%),
        radial-gradient(circle at 75% 80%, rgba(255, 151, 125, 0.7) 0 1.1%, transparent 1.3%),
        radial-gradient(circle at 82% 73%, rgba(130, 210, 106, 0.75) 0 1.2%, transparent 1.4%),
        radial-gradient(circle at 8% 55%, rgba(255, 255, 255, 0.45), transparent 14%),
        radial-gradient(circle at 92% 50%, rgba(255, 255, 255, 0.35), transparent 16%);
      pointer-events: none;
    }

    .mapShell::after {
      content: "✨ ✦ ✨          ✦          ✨";
      position: absolute;
      top: 8%;
      right: 6%;
      left: 6%;
      z-index: 2;
      color: rgba(255, 255, 255, 0.8);
      font-size: clamp(18px, 2vw, 30px);
      letter-spacing: 1.8em;
      text-shadow: 0 2px 8px rgba(55, 100, 140, 0.16);
      pointer-events: none;
    }

    .sun {
      position: absolute;
      top: 7%;
      right: 7%;
      z-index: 3;
      width: 10%;
      aspect-ratio: 1;
      border-radius: 999px;
      background: radial-gradient(circle, #fff6b8 0 35%, #ffd05a 58%, #ffb13c 100%);
      box-shadow:
        0 0 0 14px rgba(255, 221, 105, 0.16),
        0 0 42px rgba(255, 201, 85, 0.62);
    }

    .sun::before {
      content: "☀";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.86);
      font-size: clamp(20px, 3vw, 44px);
    }

    .hill {
      position: absolute;
      bottom: -12%;
      z-index: 2;
      width: 62%;
      aspect-ratio: 2.2 / 1;
      border-radius: 50% 50% 0 0;
      background:
        radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.22), transparent 24%),
        linear-gradient(180deg, rgba(104, 212, 118, 0.58), rgba(67, 178, 98, 0.48));
    }

    .hill.h1 {
      left: -9%;
    }

    .hill.h2 {
      right: -13%;
      bottom: -16%;
      background:
        radial-gradient(circle at 38% 20%, rgba(255, 255, 255, 0.2), transparent 24%),
        linear-gradient(180deg, rgba(89, 190, 224, 0.34), rgba(70, 172, 124, 0.35));
    }

    .cloud {
      position: absolute;
      z-index: 4;
      width: 13%;
      height: 6%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 20px rgba(68, 117, 155, 0.08);
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: inherit;
    }

    .cloud::before {
      top: -44%;
      left: 16%;
      width: 42%;
      aspect-ratio: 1;
    }

    .cloud::after {
      top: -58%;
      right: 12%;
      width: 50%;
      aspect-ratio: 1;
    }

    .cloud.c1 {
      top: 15%;
      left: 8%;
    }

    .cloud.c2 {
      top: 9%;
      left: 38%;
      transform: scale(0.72);
    }

    .trackSvg {
      position: absolute;
      inset: 0;
      z-index: 8;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .routeShadow {
      fill: none;
      stroke: rgba(92, 85, 64, 0.18);
      stroke-width: 52;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .routeBase {
      fill: none;
      stroke: rgba(255, 248, 226, 0.96);
      stroke-width: 42;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .routeLine {
      fill: none;
      stroke: rgba(255, 173, 66, 0.55);
      stroke-width: 5;
      stroke-dasharray: 11 14;
      stroke-linecap: round;
    }

    .markerLabel {
      fill: rgba(36, 48, 64, 0.76);
      stroke: rgba(255, 255, 255, 0.96);
      stroke-width: 7px;
      dominant-baseline: middle;
      font-size: 18px;
      font-weight: 950;
      paint-order: stroke;
    }

    .pointsLayer {
      position: absolute;
      inset: 0;
      z-index: 12;
    }

    .groupPoint {
      position: absolute;
      display: grid;
      width: 38px;
      height: 38px;
      padding: 0;
      place-items: center;
      border: 3px solid rgba(255, 255, 255, 0.95);
      border-radius: 999px;
      appearance: none;
      color: #fff;
      box-shadow: 0 8px 18px rgba(29, 42, 67, 0.24);
      cursor: pointer;
      font: 950 12px/1 inherit;
      transform: translate(-50%, -50%);
      transition:
        opacity 0.18s ease,
        scale 0.18s ease,
        filter 0.18s ease;
      user-select: none;
    }

    .groupPoint.zero {
      background: var(--gray);
    }

    .groupPoint.low {
      background: var(--blue);
    }

    .groupPoint.mid {
      background: var(--green);
    }

    .groupPoint.high {
      background: var(--orange);
    }

    .groupPoint.top {
      background: var(--red);
    }

    .groupPoint.done {
      background: var(--gold);
      color: #4b3600;
    }

    .groupPoint.dim {
      filter: grayscale(0.8);
      opacity: 0.18;
    }

    .groupPoint.active {
      z-index: 50;
      scale: 1.52;
      box-shadow:
        0 0 0 9px rgba(79, 140, 255, 0.2),
        0 0 0 18px rgba(79, 140, 255, 0.12),
        0 14px 28px rgba(29, 42, 67, 0.26);
      animation: racePulse 1.1s infinite;
    }

    @keyframes racePulse {
      0%,
      100% {
        filter: brightness(1);
      }

      50% {
        filter: brightness(1.2);
      }
    }

    .legend {
      display: flex;
      width: fit-content;
      max-width: 100%;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 14px auto 0;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 12px 28px rgba(43, 73, 110, 0.12);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 18;
    }

    .legendItem {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(36, 48, 64, 0.72);
      font-size: 12px;
      font-weight: 900;
    }

    .legendDot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
    }

    .loading {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: grid;
      padding: 20px;
      place-items: center;
      background: rgba(255, 255, 255, 0.62);
      color: #3b4b63;
      font-size: 24px;
      font-weight: 950;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .error {
      max-width: min(94%, 520px);
      margin: auto;
      padding: 14px;
      border-radius: 16px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.55;
    }

    .retryButton {
      display: block;
      margin: 12px auto 0;
      padding: 10px 18px;
      border: 0;
      border-radius: 999px;
      background: #b91c1c;
      color: #fff;
      cursor: pointer;
      font: 900 15px/1 inherit;
    }

    html[data-race-layout="portrait"] .page {
      padding: 12px;
    }

    html[data-race-layout="portrait"] .header {
      display: block;
    }

    html[data-race-layout="portrait"] .titleBlock {
      margin-bottom: 10px;
      padding: 14px 16px;
    }

    html[data-race-layout="portrait"] .eyebrow {
      font-size: 11px;
    }

    html[data-race-layout="portrait"] h1 {
      font-size: 30px;
    }

    html[data-race-layout="portrait"] .subtitle {
      font-size: 14px;
    }

    html[data-race-layout="portrait"] .searchPanel {
      width: 100%;
      max-width: none;
    }

    html[data-race-layout="portrait"] .mapShell {
      aspect-ratio: 9 / 16;
      border-radius: 28px;
    }

    html[data-race-layout="portrait"] .mapShell::after {
      top: 4%;
      right: 8%;
      left: 8%;
      line-height: 2.1;
      letter-spacing: 0.8em;
    }

    html[data-race-layout="portrait"] .markerLabel {
      font-size: 20px;
      stroke-width: 8px;
    }

    html[data-race-layout="portrait"] .groupPoint {
      width: 36px;
      height: 36px;
      font-size: 11px;
    }

    html[data-race-layout="portrait"] .legend {
      width: 100%;
      gap: 7px;
      margin: 12px 0 0;
      padding: 9px 8px;
    }

    html[data-race-layout="portrait"] .legendItem {
      gap: 4px;
      font-size: 11px;
    }

    html[data-race-layout="portrait"] .legendDot {
      width: 10px;
      height: 10px;
    }

    html[data-race-layout="portrait"] .detailCard.open {
      max-height: 430px;
    }

    @media (max-height: 520px) {
      html[data-race-layout="landscape"] .page {
        padding: 10px;
      }

      html[data-race-layout="landscape"] .header {
        gap: 10px;
        margin-bottom: 10px;
      }

      html[data-race-layout="landscape"] .titleBlock {
        padding: 10px 14px;
        border-radius: 20px;
      }

      html[data-race-layout="landscape"] .titleBlock::before {
        top: 8px;
        font-size: 16px;
      }

      html[data-race-layout="landscape"] .eyebrow {
        margin-bottom: 3px;
        font-size: 9px;
      }

      html[data-race-layout="landscape"] h1 {
        font-size: 24px;
      }

      html[data-race-layout="landscape"] .subtitle {
        margin-top: 4px;
        font-size: 11px;
      }

      html[data-race-layout="landscape"] .searchPanel {
        flex-basis: min(310px, 40vw);
        width: min(310px, 40vw);
      }

      html[data-race-layout="landscape"] .searchBox {
        padding: 10px;
        border-radius: 20px;
      }

      html[data-race-layout="landscape"] .searchLabel {
        margin-bottom: 5px;
        font-size: 11px;
      }

      html[data-race-layout="landscape"] .searchInput {
        padding: 9px 11px;
        border-radius: 14px;
        font-size: 15px;
      }

      html[data-race-layout="landscape"] .mapShell {
        max-height: calc(100vh - 150px);
      }

      html[data-race-layout="landscape"] .legend {
        margin-top: 8px;
        padding: 7px 12px;
      }

      html[data-race-layout="landscape"] .legendItem {
        font-size: 10px;
      }

      html[data-race-layout="landscape"] .legendDot {
        width: 10px;
        height: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="header">
      <div class="titleBlock">
        <div class="eyebrow">NEW TESTAMENT RACE</div>
        <h1>新約讀經賽程圖</h1>
        <div id="subtitle" class="subtitle">正在讀取資料...</div>
      </div>

      <aside class="searchPanel">
        <div class="searchBox">
          <div class="searchLabel">搜尋小組編號</div>

          <input
            id="searchInput"
            class="searchInput"
            type="text"
            inputmode="numeric"
            placeholder="例如：001、032、100"
            autocomplete="off"
          >

          <div id="detailCard" class="detailCard"></div>
        </div>
      </aside>
    </header>

    <main class="mapShell">
      <div class="sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="hill h1"></div>
      <div class="hill h2"></div>

      <svg
        id="trackSvg"
        class="trackSvg"
        viewBox="0 0 1600 900"
        preserveAspectRatio="none"
        aria-label="新約讀經賽程地圖"
      >
        <path id="routeShadow" class="routeShadow"></path>
        <path id="routeBase" class="routeBase"></path>
        <path id="routeLine" class="routeLine"></path>

        <text id="startLabel" class="markerLabel">起點</text>
        <text id="finishLabel" class="markerLabel">完成新約</text>
      </svg>

      <div id="pointsLayer" class="pointsLayer"></div>
      <div id="loading" class="loading">讀取賽程中...</div>
    </main>

    <div class="legend">
      <div class="legendItem">
        <span class="legendDot" style="background:#9ca3af"></span>0%
      </div>
      <div class="legendItem">
        <span class="legendDot" style="background:#4f8cff"></span>1–25%
      </div>
      <div class="legendItem">
        <span class="legendDot" style="background:#3ac17a"></span>25–50%
      </div>
      <div class="legendItem">
        <span class="legendDot" style="background:#ffad42"></span>50–75%
      </div>
      <div class="legendItem">
        <span class="legendDot" style="background:#ff6b6b"></span>75–99%
      </div>
      <div class="legendItem">
        <span class="legendDot" style="background:#f6c343"></span>100%
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbyZjv5XvmzZ2GHBXBUzuwBbw9MR1LPkgbGfGLfjEgCVrT9WBoH3u1f60-8k-x_GBffQSg/exec';

    const DESKTOP_VIEWBOX = '0 0 1600 900';
    const MOBILE_VIEWBOX = '0 0 900 1600';

    const DESKTOP_PATH =
      'M 115 715 C 310 630, 450 650, 610 705 C 790 765, 1085 745, 1240 640 C 1390 540, 1325 410, 1135 405 C 930 400, 755 505, 555 448 C 340 385, 255 270, 430 205 C 625 132, 900 185, 1090 205 C 1235 220, 1348 205, 1460 150';

    const MOBILE_PATH =
      'M 140 1450 C 330 1360, 370 1225, 230 1128 C 105 1040, 146 872, 345 840 C 570 804, 705 710, 555 595 C 410 482, 245 490, 250 350 C 255 205, 455 145, 760 128';

    let raceData = null;
    let groupMap = new Map();
    let selectedGroupId = '';
    let resizeTimer = null;
    let jsonpSequence = 0;
    let routeRetryCount = 0;
    let isLoadingData = false;

    document.addEventListener('DOMContentLoaded', initRacePage);

    function initRacePage() {
      syncRaceLayout();
      bindEvents();
      loadRaceData();
    }

    function bindEvents() {
      const searchInput = document.getElementById('searchInput');

      searchInput.addEventListener('input', function(event) {
        const groupId = normalizeGroupId(event.target.value);

        if (!groupId) {
          selectedGroupId = '';
          clearHighlight();
          closeDetail();
          return;
        }

        if (groupMap.has(groupId)) {
          focusGroup(groupId);
          return;
        }

        selectedGroupId = '';
        showNotFound(groupId);
      });

      window.addEventListener('resize', scheduleResponsiveRefresh, { passive: true });
      window.addEventListener('orientationchange', scheduleResponsiveRefresh, { passive: true });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', scheduleResponsiveRefresh, {
          passive: true
        });
      }
    }

    function scheduleResponsiveRefresh() {
      window.clearTimeout(resizeTimer);

      resizeTimer = window.setTimeout(function() {
        syncRaceLayout();
      }, 50);

      window.setTimeout(syncRaceLayout, 180);
      window.setTimeout(syncRaceLayout, 500);
    }

    function getViewportSize() {
      const viewport = window.visualViewport;

      const width = Math.round(
        viewport && viewport.width ? viewport.width : window.innerWidth
      );

      const height = Math.round(
        viewport && viewport.height ? viewport.height : window.innerHeight
      );

      return {
        width: Math.max(1, width),
        height: Math.max(1, height)
      };
    }

    function getRaceLayout() {
      const viewport = getViewportSize();
      return viewport.height > viewport.width ? 'portrait' : 'landscape';
    }

    function isPortraitRaceLayout() {
      return getRaceLayout() === 'portrait';
    }

    function syncRaceLayout() {
      const layout = getRaceLayout();

      document.documentElement.dataset.raceLayout = layout;
      document.body.dataset.raceLayout = layout;

      applyRoute();

      window.requestAnimationFrame(function() {
        applyRoute();
        renderPoints();
      });
    }

    function loadRaceData() {
      if (isLoadingData) {
        return;
      }

      isLoadingData = true;
      setLoading('讀取賽程中...');

      callGAS('getRaceData')
        .then(function(data) {
          if (data && data.error) {
            throw new Error(data.message || '賽程資料讀取失敗');
          }

          if (!data || !Array.isArray(data.groups)) {
            throw new Error('賽程資料格式錯誤');
          }

          setRaceData(data);
        })
        .catch(function(error) {
          showLoadingError(
            error && error.message
              ? error.message
              : '賽程資料讀取失敗'
          );
        })
        .finally(function() {
          isLoadingData = false;
        });
    }

    function retryLoadRaceData() {
      loadRaceData();
    }

    function callGAS(action) {
      return new Promise(function(resolve, reject) {
        const callbackName =
          '__raceDataCallback_' +
          Date.now() +
          '_' +
          (++jsonpSequence);

        const script = document.createElement('script');
        let settled = false;

        const timer = window.setTimeout(function() {
          finish(reject, new Error('讀取逾時，請重新讀取。'));
        }, 20000);

        function cleanUp() {
          window.clearTimeout(timer);

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          try {
            delete window[callbackName];
          } catch (error) {
            window[callbackName] = undefined;
          }
        }

        function finish(handler, value) {
          if (settled) {
            return;
          }

          settled = true;
          cleanUp();
          handler(value);
        }

        window[callbackName] = function(payload) {
          finish(resolve, payload);
        };

        script.async = true;

        script.onerror = function() {
          finish(reject, new Error('無法讀取賽程資料。'));
        };

        script.onload = function() {
          window.setTimeout(function() {
            if (!settled) {
              finish(reject, new Error('賽程資料回應格式錯誤。'));
            }
          }, 0);
        };

        script.src =
          GAS_WEB_APP_URL +
          '?action=' +
          encodeURIComponent(action) +
          '&callback=' +
          encodeURIComponent(callbackName) +
          '&_=' +
          Date.now();

        document.head.appendChild(script);
      });
    }

    function setRaceData(data) {
      const totalChapters = Math.max(0, Number(data.totalChapters) || 0);

      raceData = {
        totalChapters: totalChapters,
        updatedAt: String(data.updatedAt || '').trim(),
        groups: data.groups
          .filter(function(group) {
            return group && String(group.groupId || '').trim();
          })
          .map(function(group) {
            const groupTotal = Math.max(
              0,
              Number(group.totalChapters) || totalChapters
            );

            const groupDone = Math.max(
              0,
              Math.min(
                Number(group.totalDone) || 0,
                groupTotal || Number(group.totalDone) || 0
              )
            );

            const calculatedPercent = groupTotal
              ? groupDone / groupTotal * 100
              : 0;

            const rawPercent = Number(group.percent);

            return {
              groupId:
                normalizeGroupId(group.groupId) ||
                String(group.groupId).trim(),

              totalDone: groupDone,
              totalChapters: groupTotal,

              percent: Number.isFinite(rawPercent)
                ? clampPercent(rawPercent)
                : clampPercent(calculatedPercent),

              books: Array.isArray(group.books)
                ? group.books.map(function(book) {
                    const total = Math.max(0, Number(book.total) || 0);

                    const done = Math.max(
                      0,
                      Math.min(Number(book.done) || 0, total)
                    );

                    const calculatedBookPercent = total
                      ? done / total * 100
                      : 0;

                    const rawBookPercent = Number(book.percent);

                    return {
                      shortName: String(
                        book.shortName || book.name || ''
                      ).trim(),

                      done: done,
                      total: total,

                      percent: Number.isFinite(rawBookPercent)
                        ? clampPercent(rawBookPercent)
                        : clampPercent(calculatedBookPercent)
                    };
                  })
                : []
            };
          })
      };

      groupMap = new Map();

      raceData.groups.forEach(function(group) {
        groupMap.set(group.groupId, group);
      });

      document.getElementById('subtitle').textContent =
        '共 ' +
        raceData.groups.length +
        ' 組正在奔跑｜新約共 ' +
        raceData.totalChapters +
        ' 章' +
        (raceData.updatedAt
          ? '｜更新：' + raceData.updatedAt
          : '');

      hideLoading();
      routeRetryCount = 0;

      syncRaceLayout();

      const inputGroupId = normalizeGroupId(
        document.getElementById('searchInput').value
      );

      if (inputGroupId && groupMap.has(inputGroupId)) {
        focusGroup(inputGroupId);
      }
    }

    function setLoading(text) {
      const loading = document.getElementById('loading');
      loading.textContent = text;
      loading.style.display = 'grid';
    }

    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }

    function showLoadingError(message) {
      const loading = document.getElementById('loading');

      loading.replaceChildren();

      const errorBox = document.createElement('div');
      errorBox.className = 'error';

      const text = document.createElement('div');
      text.textContent = '讀取失敗：' + String(message || '未知錯誤');

      const retryButton = document.createElement('button');
      retryButton.type = 'button';
      retryButton.className = 'retryButton';
      retryButton.textContent = '重新讀取';
      retryButton.addEventListener('click', retryLoadRaceData);

      errorBox.appendChild(text);
      errorBox.appendChild(retryButton);

      loading.appendChild(errorBox);
      loading.style.display = 'grid';
    }

    function applyRoute() {
      const svg = document.getElementById('trackSvg');
      const routeShadow = document.getElementById('routeShadow');
      const routeBase = document.getElementById('routeBase');
      const routeLine = document.getElementById('routeLine');

      if (!svg || !routeShadow || !routeBase || !routeLine) {
        return;
      }

      const isPortrait = isPortraitRaceLayout();
      const path = isPortrait ? MOBILE_PATH : DESKTOP_PATH;

      svg.setAttribute(
        'viewBox',
        isPortrait ? MOBILE_VIEWBOX : DESKTOP_VIEWBOX
      );

      routeShadow.setAttribute('d', path);
      routeBase.setAttribute('d', path);
      routeLine.setAttribute('d', path);

      updateRouteLabels(isPortrait);
    }

    function updateRouteLabels(isPortrait) {
      const startLabel = document.getElementById('startLabel');
      const finishLabel = document.getElementById('finishLabel');

      if (!startLabel || !finishLabel) {
        return;
      }

      if (isPortrait) {
        startLabel.setAttribute('x', '140');
        startLabel.setAttribute('y', '1400');
        startLabel.setAttribute('text-anchor', 'middle');

        finishLabel.setAttribute('x', '700');
        finishLabel.setAttribute('y', '200');
        finishLabel.setAttribute('text-anchor', 'middle');
        return;
      }

      startLabel.setAttribute('x', '100');
      startLabel.setAttribute('y', '765');
      startLabel.setAttribute('text-anchor', 'middle');

      finishLabel.setAttribute('x', '1370');
      finishLabel.setAttribute('y', '205');
      finishLabel.setAttribute('text-anchor', 'middle');
    }

    function getRouteMetrics() {
      const route = document.getElementById('routeBase');

      if (!route || typeof route.getTotalLength !== 'function') {
        return null;
      }

      try {
        const length = route.getTotalLength();

        if (!Number.isFinite(length) || length <= 0) {
          return null;
        }

        return {
          route: route,
          length: length
        };
      } catch (error) {
        return null;
      }
    }

    function renderPoints() {
      if (!raceData) {
        return;
      }

      const layer = document.getElementById('pointsLayer');
      const metrics = getRouteMetrics();

      if (!layer) {
        return;
      }

      if (!metrics) {
        if (routeRetryCount < 8) {
          routeRetryCount += 1;

          window.setTimeout(function() {
            applyRoute();
            renderPoints();
          }, 120);
        }

        return;
      }

      routeRetryCount = 0;

      const mobile = isPortraitRaceLayout();
      const viewBoxWidth = mobile ? 900 : 1600;
      const viewBoxHeight = mobile ? 1600 : 900;
      const usedSlots = Object.create(null);

      layer.replaceChildren();

      raceData.groups.forEach(function(group) {
        const percent = clampPercent(group.percent);

        let basePoint;

        try {
          basePoint = metrics.route.getPointAtLength(
            metrics.length * percent / 100
          );
        } catch (error) {
          return;
        }

        const slot = String(Math.round(percent * 2) / 2);
        const index = usedSlots[slot] || 0;
        usedSlots[slot] = index + 1;

        const ring = Math.floor(index / 8);
        const angle = index % 8 * 45;
        const radius = ring === 0 ? 0 : 18 + (ring - 1) * 14;

        const offsetX =
          Math.cos(angle * Math.PI / 180) * radius;

        const offsetY =
          Math.sin(angle * Math.PI / 180) * radius;

        const point = document.createElement('button');

        point.type = 'button';
        point.className =
          'groupPoint ' + getPercentClass(percent);

        point.dataset.groupId = group.groupId;
        point.textContent = group.groupId;
        point.title =
          group.groupId +
          ' 組｜' +
          formatPercent(percent) +
          '%';

        point.setAttribute(
          'aria-label',
          group.groupId +
          ' 組，完成 ' +
          formatPercent(percent) +
          '%'
        );

        point.style.left =
          'calc(' +
          basePoint.x / viewBoxWidth * 100 +
          '% + ' +
          offsetX +
          'px)';

        point.style.top =
          'calc(' +
          basePoint.y / viewBoxHeight * 100 +
          '% + ' +
          offsetY +
          'px)';

        point.addEventListener('click', function() {
          document.getElementById('searchInput').value =
            group.groupId;

          focusGroup(group.groupId);
        });

        layer.appendChild(point);
      });

      applyCurrentHighlight();
    }

    function focusGroup(groupId) {
      const normalizedGroupId = String(groupId || '');
      const group = groupMap.get(normalizedGroupId);

      if (!group) {
        selectedGroupId = '';
        showNotFound(normalizedGroupId);
        return;
      }

      selectedGroupId = normalizedGroupId;
      applyCurrentHighlight();
      showDetail(group);
    }

    function applyCurrentHighlight() {
      const points = document.querySelectorAll('.groupPoint');

      if (!selectedGroupId) {
        points.forEach(function(point) {
          point.classList.remove('active', 'dim');
        });

        return;
      }

      points.forEach(function(point) {
        const active =
          point.dataset.groupId === selectedGroupId;

        point.classList.toggle('active', active);
        point.classList.toggle('dim', !active);
      });
    }

    function clearHighlight() {
      selectedGroupId = '';

      document.querySelectorAll('.groupPoint').forEach(function(point) {
        point.classList.remove('active', 'dim');
      });
    }

    function showDetail(group) {
      const booksHtml = group.books.length
        ? group.books.map(function(book) {
            return (
              '<div class="bookRow">' +
                '<div>' +
                  escapeHtml(book.shortName) +
                '</div>' +
                '<div class="bar">' +
                  '<div class="barFill" style="width:' +
                    clampPercent(book.percent) +
                    '%"></div>' +
                '</div>' +
                '<div>' +
                  book.done +
                  '/' +
                  book.total +
                '</div>' +
              '</div>'
            );
          }).join('')
        : '<div style="color:#6b7280;font-weight:800;">尚無回報</div>';

      const card = document.getElementById('detailCard');

      card.innerHTML =
        '<div class="detailTitle">' +
          '<span>' +
            escapeHtml(group.groupId) +
            ' 組</span>' +
          '<span class="badge">' +
            formatPercent(group.percent) +
            '%</span>' +
        '</div>' +
        '<div class="detailStats">' +
          '<div class="stat">' +
            '<div class="statLabel">完成章數</div>' +
            '<div class="statValue">' +
              group.totalDone +
              '/' +
              group.totalChapters +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div style="font-size:14px;font-weight:950;margin-top:8px;">各卷進度</div>' +
        '<div class="bookList">' +
          booksHtml +
        '</div>';

      card.classList.add('open');
    }

    function showNotFound(groupId) {
      clearHighlight();

      const card = document.getElementById('detailCard');

      card.innerHTML =
        '<div class="detailTitle">' +
          '<span>找不到 ' +
            escapeHtml(groupId) +
            ' 組</span>' +
        '</div>' +
        '<div style="color:#6b7280;font-weight:800;">請確認小組編號是否存在。</div>';

      card.classList.add('open');
    }

    function closeDetail() {
      const card = document.getElementById('detailCard');

      card.classList.remove('open');
      card.replaceChildren();
    }

    function getPercentClass(percent) {
      if (percent >= 100) return 'done';
      if (percent >= 75) return 'top';
      if (percent >= 50) return 'high';
      if (percent >= 25) return 'mid';
      if (percent > 0) return 'low';
      return 'zero';
    }

    function clampPercent(value) {
      const number = Number(value);

      return Math.max(
        0,
        Math.min(
          100,
          Number.isFinite(number) ? number : 0
        )
      );
    }

    function formatPercent(value) {
      const number = clampPercent(value);

      return Number.isInteger(number)
        ? String(number)
        : String(Math.round(number * 10) / 10);
    }

    function normalizeGroupId(value) {
      const text = String(value || '').trim();

      if (/^\d+$/.test(text)) {
        return String(Number(text)).padStart(3, '0');
      }

      return text;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
