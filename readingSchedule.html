<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg1: #fff4df;
      --bg2: #fff9ee;
      --card: rgba(255,255,255,.92);
      --text: #4a2514;
      --muted: #8b6f5a;
      --orange: #ff8a24;
      --pink: #ff6b8a;
      --blue: #35c5cf;
      --shadow: 0 18px 38px rgba(106, 63, 25, .16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 231, 107, .42), transparent 12%),
        radial-gradient(circle at 84% 10%, rgba(66, 199, 220, .18), transparent 18%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(980px, calc(100% - 24px));
      margin: 0 auto;
      padding: 18px 0 44px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(135deg, #ff7a21, #ffae31 62%, #ffd84c);
      color: #fff;
      padding: 18px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      min-height: 104px;
    }

    .hero::before {
      content: "";
      position: absolute;
      right: -36px;
      top: -70px;
      width: 190px;
      height: 190px;
      border-radius: 46px;
      background: rgba(255,255,255,.2);
      transform: rotate(8deg);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: 118px;
      bottom: -58px;
      width: 118px;
      height: 118px;
      border-radius: 34px;
      background: rgba(255,255,255,.16);
      transform: rotate(18deg);
    }

    .hero-inner {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      margin-bottom: 6px;
      opacity: .95;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.16;
      letter-spacing: .02em;
    }

    .subtitle {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 700;
      opacity: .92;
    }

    .top-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 14px;
      margin-bottom: 12px;
    }

    .info-card {
      background: var(--card);
      border: 2px solid rgba(255,255,255,.96);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 16px 18px;
    }

    .info-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 950;
      margin-bottom: 9px;
    }

    .icon-bubble {
      width: 32px;
      height: 32px;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff6b8a, #ff8a24);
      color: #fff;
      font-size: 15px;
      font-weight: 950;
      box-shadow: 0 8px 16px rgba(255,107,138,.25);
      flex: 0 0 auto;
    }

    .week-pill {
      display: inline-block;
      border-radius: 999px;
      background: #fff0d5;
      color: #9a3412;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 950;
      margin-bottom: 8px;
    }

    .reading-main {
      font-size: 27px;
      line-height: 1.22;
      font-weight: 950;
      color: #762b15;
      margin-bottom: 8px;
    }

    .reading-sub {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.5;
    }

    .reading-sub:empty {
      display: none;
    }

    .exhibit-date {
      font-size: 25px;
      line-height: 1.2;
      font-weight: 950;
      color: #8a3414;
      margin-bottom: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: rgba(255,255,255,.86);
      border: 2px solid rgba(255,255,255,.96);
      border-radius: 18px;
      box-shadow: 0 12px 24px rgba(106,63,25,.1);
      padding: 12px 14px;
    }

    .stat .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 950;
      margin-bottom: 4px;
    }

    .stat .value {
      color: #762b15;
      font-size: 20px;
      font-weight: 950;
    }

    .week-area {
      background: rgba(255, 251, 239, .72);
      border: 2px solid rgba(255,255,255,.92);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 14px;
      margin-top: 8px;
    }

    .week-area-head {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      margin-bottom: 12px;
      padding: 2px 2px 10px;
      border-bottom: 2px dashed rgba(201,130,59,.38);
    }

    .today-btn {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 950;
      color: #fff;
      height: 42px;
      padding: 0 15px;
      border-radius: 15px;
      font-size: 14px;
      background: linear-gradient(135deg, #ff6b8a, #ff8a24);
      box-shadow: 0 10px 20px rgba(106,63,25,.14);
      white-space: nowrap;
    }

    .week-list {
      display: grid;
      gap: 12px;
    }

    .month-divider {
      margin: 14px 0 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #6b2c17;
      font-size: 18px;
      font-weight: 950;
    }

    .month-divider::after {
      content: "";
      height: 2px;
      flex: 1;
      border-bottom: 2px dashed rgba(201,130,59,.38);
    }

    .week-card {
      display: grid;
      grid-template-columns: 110px 1fr 170px;
      align-items: stretch;
      gap: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #fffefa, #fff5df);
      border: 2px solid #fff;
      border-radius: 24px;
      box-shadow: 0 12px 26px rgba(106,63,25,.1);
      position: relative;
    }

    .week-card.current {
      outline: 4px solid rgba(53,197,207,.35);
      background: linear-gradient(180deg, #f0fdff, #fff8e8);
    }

    .week-card.exhibition-week {
      outline: 4px solid rgba(255,107,138,.18);
    }

    .week-number-box {
      background: linear-gradient(135deg, #ffbf57, #ff8a24);
      color: #fff;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .week-number-label {
      font-size: 12px;
      font-weight: 900;
      opacity: .92;
      margin-bottom: 4px;
    }

    .week-number {
      font-size: 34px;
      line-height: 1;
      font-weight: 950;
    }

    .week-main {
      padding: 16px 18px;
      min-width: 0;
    }

    .week-date {
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .week-reading {
      color: #762b15;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 950;
      margin-bottom: 9px;
      word-break: keep-all;
    }

    .week-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      line-height: 1;
      font-weight: 950;
    }

    .tag.stage {
      background: #fff0d5;
      color: #9a3412;
    }

    .tag.reading {
      background: #dffcff;
      color: #087f8c;
    }

    .tag.buffer {
      background: #fff0c2;
      color: #8a5a00;
    }

    .week-note {
      border-left: 2px dashed rgba(201,130,59,.38);
      padding: 16px 14px;
      background: rgba(255,255,255,.46);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
    }

    .note-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 950;
    }

    .note-empty {
      color: #b79b83;
      font-size: 13px;
      font-weight: 850;
    }

    .exhibit-note {
      background: linear-gradient(135deg, #ff6b8a, #fb4d72);
      color: #fff;
      border-radius: 14px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 950;
      box-shadow: 0 8px 16px rgba(255,107,138,.2);
    }

    .exhibit-date-small {
      display: block;
      font-size: 12px;
      opacity: .92;
      margin-top: 3px;
    }

    .notice {
      background: #fff1f2;
      color: #9f1239;
      border: 1px solid #fecdd3;
      border-radius: 18px;
      padding: 16px;
      font-weight: 850;
      line-height: 1.7;
      box-shadow: var(--shadow);
    }

    @media (max-width: 980px) {
      .page {
        width: min(100% - 16px, 980px);
        padding-top: 12px;
      }

      .hero {
        padding: 18px;
        min-height: auto;
        border-radius: 24px;
      }

      h1 {
        font-size: 23px;
      }

      .subtitle {
        font-size: 13px;
      }

      .top-grid,
      .stats {
        grid-template-columns: 1fr;
      }

      .week-card {
        grid-template-columns: 88px 1fr;
      }

      .week-note {
        grid-column: 1 / -1;
        border-left: none;
        border-top: 2px dashed rgba(201,130,59,.38);
        padding: 12px 14px;
      }
    }

    @media (max-width: 520px) {
      .page {
        width: 100%;
        padding: 0 0 34px;
      }

      .hero {
        margin: 0 8px 10px;
        border-radius: 0 0 22px 22px;
      }

      .top-grid,
      .stats,
      .week-area {
        margin-left: 8px;
        margin-right: 8px;
      }

      .info-card {
        padding: 14px;
        border-radius: 20px;
      }

      .week-card {
        grid-template-columns: 72px 1fr;
        border-radius: 20px;
      }

      .week-number {
        font-size: 26px;
      }

      .week-main {
        padding: 13px 12px;
      }

      .week-reading {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <section class="hero">
      <div class="hero-inner">
        <div class="eyebrow">READING WEEKLY PLAN</div>
        <h1 id="planName">讀經進度表</h1>
        <p class="subtitle">青少年家庭共讀進度。日期依台北時間判斷。</p>
      </div>
    </section>

    <div id="emptyNotice" class="notice" style="display:none;">
      目前尚未產生讀經進度表。請管理者先到設定頁面產生並寫入進度。
    </div>

    <section id="contentArea" style="display:none;">
      <div class="top-grid">
        <div class="info-card">
          <div class="info-title">
            <span class="icon-bubble">今</span>
            <span>本週讀經</span>
          </div>
          <div id="currentWeekNo" class="week-pill">第 - 週</div>
          <div id="currentReading" class="reading-main">-</div>
          <div id="currentMeta" class="reading-sub"></div>
        </div>

        <div class="info-card">
          <div class="info-title">
            <span class="icon-bubble">展</span>
            <span>下一次展覽聚會</span>
          </div>
          <div id="nextExhibitionDate" class="exhibit-date">尚未安排</div>
          <div id="nextExhibitionMeta" class="reading-sub"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="label">今天日期</div>
          <div id="todayTaipei" class="value">-</div>
        </div>
        <div class="stat">
          <div class="label">總週數</div>
          <div id="sumTotalWeeks" class="value">0</div>
        </div>
        <div class="stat">
          <div class="label">完成日</div>
          <div id="sumCompletionDate" class="value">-</div>
        </div>
      </div>

      <section class="week-area">
        <div class="week-area-head">
          <button class="today-btn" onclick="scrollToToday()">前往今天</button>
        </div>

        <div id="weekList" class="week-list"></div>
      </section>
    </section>
  </div>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyZjv5XvmzZ2GHBXBUzuwBbw9MR1LPkgbGfGLfjEgCVrT9WBoH3u1f60-8k-x_GBffQSg/exec';

    let currentWeekNo = null;
    let allRows = [];
    let taipeiTodayDate = null;

    window.addEventListener('load', function () {
      callGasApi('readingGetPublicSchedule')
        .then(renderPage)
        .catch(function (err) {
          const notice = document.getElementById('emptyNotice');
          notice.style.display = 'block';
          notice.textContent = err && err.message ? err.message : String(err);
        });
    });

    function callGasApi(action, payload) {
      return new Promise(function(resolve, reject) {
        const callbackName =
          'readingCallback_' +
          Date.now() +
          '_' +
          Math.random().toString(36).slice(2);

        const script = document.createElement('script');

        const timer = setTimeout(function() {
          cleanup();
          reject(new Error('讀取逾時，請確認 Apps Script 網頁應用程式網址與部署權限'));
        }, 20000);

        function cleanup() {
          clearTimeout(timer);

          if (script && script.parentNode) {
            script.parentNode.removeChild(script);
          }

          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }
        }

        window[callbackName] = function(response) {
          cleanup();

          if (!response || response.success !== true) {
            reject(new Error(response && response.message ? response.message : '讀取失敗'));
            return;
          }

          resolve(response.data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('無法連線到 Apps Script，請確認部署權限與網址'));
        };

        const params = [
          'action=' + encodeURIComponent(action),
          'callback=' + encodeURIComponent(callbackName),
          '_=' + Date.now()
        ];

        if (payload !== undefined) {
          params.push('payload=' + encodeURIComponent(JSON.stringify(payload)));
        }

        const separator = GAS_WEB_APP_URL.indexOf('?') >= 0 ? '&' : '?';
        script.src = GAS_WEB_APP_URL + separator + params.join('&');

        document.body.appendChild(script);
      });
    }

    function renderPage(res) {
      if (!res || !res.success || !res.rows || !res.rows.length) {
        document.getElementById('emptyNotice').style.display = 'block';
        return;
      }

      document.getElementById('contentArea').style.display = 'block';

      const config = res.config || {};
      const rows = res.rows || [];
      const todayText = res.todayDate || '';
      const currentWeek = findCurrentWeekByTaipeiDate(rows, todayText);
      const nextExhibition = findNextExhibitionByTaipeiDate(rows, todayText);
      const summary = res.summary || {};

      allRows = rows;
      taipeiTodayDate = parseDate(todayText);

      document.getElementById('planName').textContent = config.planName || '讀經進度表';
      document.getElementById('todayTaipei').textContent = formatFullDate(todayText);

      if (currentWeek) {
        currentWeekNo = Number(currentWeek.weekNo);
        document.getElementById('currentWeekNo').textContent = '第 ' + currentWeek.weekNo + ' 週';
        document.getElementById('currentReading').textContent = currentWeek.readingRange || '-';
        document.getElementById('currentMeta').textContent =
          formatShortDate(currentWeek.startDate) + '–' + formatShortDate(currentWeek.endDate) +
          '｜' + currentWeek.stageName + '｜' + currentWeek.weekType;
      } else {
        currentWeekNo = null;
        document.getElementById('currentWeekNo').textContent = '非計畫週次';
        document.getElementById('currentReading').textContent = getNearestWeekText(rows, todayText);
        document.getElementById('currentMeta').textContent = '';
      }

      if (nextExhibition) {
        document.getElementById('nextExhibitionDate').textContent = formatShortDate(nextExhibition.exhibitionDate);
        document.getElementById('nextExhibitionMeta').textContent =
          '第 ' + nextExhibition.weekNo + ' 週｜' + nextExhibition.stageName;
      } else {
        document.getElementById('nextExhibitionDate').textContent = '尚未安排';
        document.getElementById('nextExhibitionMeta').textContent = '';
      }

      document.getElementById('sumTotalWeeks').textContent = summary.totalWeeks || rows.length || 0;
      document.getElementById('sumCompletionDate').textContent = formatFullDate(summary.completionDate || getLastEndDate(rows));

      renderWeekList(rows);
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function renderWeekList(rows) {
      const list = document.getElementById('weekList');
      list.innerHTML = '';

      let lastMonthKey = '';

      rows.forEach(function (row) {
        const startDate = parseDate(row.startDate);
        const monthKey = startDate ? startDate.getFullYear() + '-' + pad2(startDate.getMonth() + 1) : '';

        if (monthKey && monthKey !== lastMonthKey) {
          lastMonthKey = monthKey;

          const divider = document.createElement('div');
          divider.className = 'month-divider';
          divider.textContent = startDate.getFullYear() + '年 ' + (startDate.getMonth() + 1) + '月';
          list.appendChild(divider);
        }

        const card = document.createElement('div');
        const isCurrent = Number(row.weekNo) === Number(currentWeekNo);
        const hasExhibition = !!row.exhibitionDate;
        const isBuffer = row.weekType === '緩衝展覽週';

        card.className = 'week-card'
          + (isCurrent ? ' current' : '')
          + (hasExhibition ? ' exhibition-week' : '');

        card.id = 'week-' + row.weekNo;

        const typeTag = isBuffer
          ? '<span class="tag buffer">緩衝展覽週</span>'
          : '<span class="tag reading">讀經週</span>';

        const noteHtml = hasExhibition
          ? `
            <div class="note-title">備註</div>
            <div class="exhibit-note">
              展覽聚會
              <span class="exhibit-date-small">${formatShortDate(row.exhibitionDate)}｜分享讀經享受</span>
            </div>
          `
          : `
            <div class="note-title">備註</div>
            <div class="note-empty">—</div>
          `;

        card.innerHTML = `
          <div class="week-number-box">
            <div class="week-number-label">第</div>
            <div class="week-number">${row.weekNo}</div>
            <div class="week-number-label">週</div>
          </div>

          <div class="week-main">
            <div class="week-date">${formatDateRange(row.startDate, row.endDate)}</div>
            <div class="week-reading">${escapeHtml(row.readingRange || '-')}</div>
            <div class="week-meta">
              <span class="tag stage">${escapeHtml(row.stageName || '')}</span>
              ${typeTag}
            </div>
          </div>

          <div class="week-note">
            ${noteHtml}
          </div>
        `;

        list.appendChild(card);
      });
    }

    function scrollToToday(smooth = true) {
      let target = null;

      if (currentWeekNo) {
        target = document.getElementById('week-' + currentWeekNo);
      }

      if (!target) {
        target = findNearestWeekElementByTaipeiDate();
      }

      if (!target) return;

      target.scrollIntoView({
        behavior: smooth ? 'smooth' : 'auto',
        block: 'center'
      });
    }

    function findNearestWeekElementByTaipeiDate() {
      if (!allRows.length || !taipeiTodayDate) return null;

      const today = stripTime(taipeiTodayDate).getTime();

      let bestRow = allRows[0];
      let bestDistance = Infinity;

      allRows.forEach(function (row) {
        const start = parseDate(row.startDate);

        if (!start) return;

        const distance = Math.abs(stripTime(start).getTime() - today);

        if (distance < bestDistance) {
          bestDistance = distance;
          bestRow = row;
        }
      });

      return document.getElementById('week-' + bestRow.weekNo);
    }

    function findCurrentWeekByTaipeiDate(rows, todayText) {
      const today = parseDate(todayText);

      if (!today) return null;

      const todayTime = stripTime(today).getTime();

      for (let i = 0; i < rows.length; i++) {
        const start = parseDate(rows[i].startDate);
        const end = parseDate(rows[i].endDate);

        if (!start || !end) continue;

        if (todayTime >= stripTime(start).getTime() && todayTime <= stripTime(end).getTime()) {
          return rows[i];
        }
      }

      return null;
    }

    function findNextExhibitionByTaipeiDate(rows, todayText) {
      const today = parseDate(todayText);

      if (!today) return null;

      const todayTime = stripTime(today).getTime();
      let next = null;

      rows.forEach(function (row) {
        const exhibit = parseDate(row.exhibitionDate);

        if (!exhibit) return;

        const exhibitTime = stripTime(exhibit).getTime();

        if (exhibitTime < todayTime) return;

        if (!next) {
          next = row;
          return;
        }

        const currentNext = parseDate(next.exhibitionDate);

        if (currentNext && exhibitTime < stripTime(currentNext).getTime()) {
          next = row;
        }
      });

      return next;
    }

    function getNearestWeekText(rows, todayText) {
      if (!rows.length) return '-';

      const today = parseDate(todayText);

      if (!today) return '-';

      const todayTime = stripTime(today).getTime();
      const first = parseDate(rows[0].startDate);
      const last = parseDate(rows[rows.length - 1].endDate);

      if (first && todayTime < stripTime(first).getTime()) {
        return '尚未開始';
      }

      if (last && todayTime > stripTime(last).getTime()) {
        return '讀經計畫已完成';
      }

      return '-';
    }

    function getLastEndDate(rows) {
      if (!rows.length) return '';
      return rows[rows.length - 1].endDate || '';
    }

    function formatDateRange(startValue, endValue) {
      const start = parseDate(startValue);
      const end = parseDate(endValue);

      if (!start || !end) return '-';

      if (start.getFullYear() === end.getFullYear()) {
        return start.getFullYear() + '/' +
          (start.getMonth() + 1) + '/' + start.getDate() +
          '–' +
          (end.getMonth() + 1) + '/' + end.getDate();
      }

      return formatFullDate(startValue) + '–' + formatFullDate(endValue);
    }

    function formatFullDate(value) {
      const date = parseDate(value);

      if (!date) return '-';

      return date.getFullYear() + '/' + (date.getMonth() + 1) + '/' + date.getDate();
    }

    function formatShortDate(value) {
      const date = parseDate(value);

      if (!date) return '-';

      return (date.getMonth() + 1) + '/' + date.getDate();
    }

    function parseDate(value) {
      if (!value) return null;

      if (Object.prototype.toString.call(value) === '[object Date]' && !isNaN(value.getTime())) {
        return stripTime(value);
      }

      const text = String(value).trim();

      let matched = text.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);

      if (matched) {
        return new Date(Number(matched[1]), Number(matched[2]) - 1, Number(matched[3]));
      }

      matched = text.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);

      if (matched) {
        return new Date(Number(matched[3]), Number(matched[1]) - 1, Number(matched[2]));
      }

      const parsed = new Date(text);

      if (!isNaN(parsed.getTime())) {
        return stripTime(parsed);
      }

      return null;
    }

    function stripTime(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
