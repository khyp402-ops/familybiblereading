<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg-0: #101722;
      --bg-1: #172231;
      --bg-2: #223247;
      --blue-0: #dceafe;
      --blue-1: #b7cce8;
      --blue-2: #7d99bd;
      --blue-3: #4e6786;
      --blue-4: #314763;
      --text: #f5f7fa;
      --text-muted: #aab7c6;
      --border: rgba(244, 246, 248, 0.18);
      --success: #8fd19e;
      --error: #ff9a95;
      --danger: #b76e6a;
      --danger-dark: #7f3f40;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 16% 8%, rgba(183, 204, 232, 0.16), transparent 34%),
        radial-gradient(circle at 82% 18%, rgba(78, 103, 134, 0.22), transparent 32%),
        linear-gradient(135deg, var(--bg-0), var(--bg-1) 42%, var(--bg-2));
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans TC", sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 34px 18px 70px;
    }

    .hero,
    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.31);
      backdrop-filter: blur(10px);
    }

    .hero {
      margin: 4px 0 24px;
      padding: 36px 22px 32px;
      border-radius: 30px;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(244,246,248,0.16), rgba(244,246,248,0.06)),
        linear-gradient(120deg, rgba(78,103,134,0.22), rgba(16,23,34,0.08));
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -42px;
      bottom: -84px;
      width: 190px;
      height: 190px;
      border: 1px solid rgba(244,246,248,0.20);
      transform: rotate(18deg);
      background: rgba(244,246,248,0.045);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      padding: 8px 16px;
      border: 1px solid rgba(244,246,248,0.18);
      border-radius: 999px;
      color: var(--blue-1);
      background: rgba(244,246,248,0.10);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: 39px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: 0.04em;
    }

    .title-line {
      width: 150px;
      height: 5px;
      margin: 18px auto 0;
      border-radius: 999px;
      background:
        linear-gradient(
          90deg,
          transparent,
          var(--blue-1),
          var(--danger),
          var(--blue-1),
          transparent
        );
    }

    .subtitle {
      max-width: 660px;
      margin: 16px auto 0;
      color: var(--text-muted);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.75;
    }

    .card {
      margin-bottom: 22px;
      padding: 26px;
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(244,246,248,0.135), rgba(244,246,248,0.06)),
        linear-gradient(120deg, rgba(49,71,99,0.22), rgba(16,23,34,0.18));
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--text);
      font-size: 25px;
      font-weight: 900;
    }

    .card-title::before {
      content: "";
      width: 16px;
      height: 34px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--blue-1), var(--blue-4));
      flex: 0 0 auto;
    }

    .card-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(183,204,232,0.32), transparent);
    }

    .row,
    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .button-row {
      margin-top: 22px;
      gap: 14px;
    }

    label {
      display: block;
      margin: 16px 0 9px;
      color: var(--blue-1);
      font-size: 18px;
      font-weight: 900;
    }

    select {
      width: 100%;
      min-height: 56px;
      padding: 14px 16px;
      border: 1px solid rgba(244,246,248,0.25);
      border-radius: 16px;
      outline: none;
      background: #edf2f7;
      color: #111827;
      font-size: 20px;
      font-weight: 800;
    }

    select:focus {
      border-color: var(--blue-1);
      box-shadow: 0 0 0 4px rgba(183,204,232,0.16);
    }

    button {
      width: 100%;
      min-height: 58px;
      padding: 16px 18px;
      border: 0;
      border-radius: 18px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--blue-2), var(--blue-4));
      box-shadow: 0 16px 32px rgba(0,0,0,0.30);
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
    }

    button.danger {
      background: linear-gradient(135deg, var(--danger), var(--danger-dark));
    }

    button.send {
      margin-top: 4px;
      background: linear-gradient(135deg, var(--blue-1), var(--blue-3) 52%, var(--blue-4));
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      box-shadow: none;
    }

    .note {
      margin-top: 18px;
      padding: 15px 17px;
      border: 1px solid rgba(244,246,248,0.16);
      border-radius: 18px;
      color: var(--text-muted);
      background: rgba(244,246,248,0.07);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.75;
    }

    .decor-line {
      height: 1px;
      margin: 20px 0 4px;
      background: linear-gradient(90deg, transparent, rgba(183,204,232,0.28), transparent);
    }

    .status {
      min-height: 28px;
      margin-top: 17px;
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 900;
      line-height: 1.65;
      text-align: center;
      white-space: pre-wrap;
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--error);
    }

    @media (max-width: 700px) {
      .page {
        padding: 22px 12px 54px;
      }

      .hero {
        padding: 28px 16px 26px;
        border-radius: 24px;
      }

      h1 {
        font-size: 31px;
      }

      .subtitle {
        font-size: 16px;
      }

      .card {
        padding: 21px 16px;
        border-radius: 24px;
      }

      .card-title {
        font-size: 23px;
      }

      .row,
      .button-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      button {
        margin-top: 14px;
        min-height: 60px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <div class="eyebrow">READING REPORT MAIL SETTING</div>
      <h1>共讀進度報告寄送設定</h1>
      <div class="title-line"></div>
      <div class="subtitle">
        設定青少年共讀進度報告的固定寄送時間，或立即產生目前進度並寄送一次。
      </div>
    </section>

    <section class="card">
      <div class="card-title">一、設定固定寄送時間</div>

      <div class="row">
        <div>
          <label for="dayOfWeek">星期</label>
          <select id="dayOfWeek">
            <option value="">請選擇星期</option>
            <option value="SUNDAY">星期日</option>
            <option value="MONDAY">星期一</option>
            <option value="TUESDAY">星期二</option>
            <option value="WEDNESDAY">星期三</option>
            <option value="THURSDAY">星期四</option>
            <option value="FRIDAY">星期五</option>
            <option value="SATURDAY">星期六</option>
          </select>
        </div>

        <div>
          <label for="hour">時間</label>
          <select id="hour">
            <option value="">請選擇時間</option>
            <option value="6">06:00</option>
            <option value="7">07:00</option>
            <option value="8">08:00</option>
            <option value="9">09:00</option>
            <option value="10">10:00</option>
            <option value="11">11:00</option>
            <option value="12">12:00</option>
            <option value="13">13:00</option>
            <option value="14">14:00</option>
            <option value="15">15:00</option>
            <option value="16">16:00</option>
            <option value="17">17:00</option>
            <option value="18">18:00</option>
            <option value="19">19:00</option>
            <option value="20">20:00</option>
            <option value="21">21:00</option>
            <option value="22">22:00</option>
            <option value="23">23:00</option>
          </select>
        </div>
      </div>

      <div class="button-row">
        <button id="saveBtn" type="button" onclick="saveSchedule()">
          儲存排程
        </button>

        <button
          id="deleteBtn"
          class="danger"
          type="button"
          onclick="deleteSchedule()"
        >
          刪除固定寄送時間
        </button>
      </div>

      <div class="note">
        固定寄送會寄給「報名名單」中「是否願意定期收到報表」為「是」且有填寫 E-mail 的人。
      </div>

      <div class="decor-line"></div>
      <div id="scheduleStatus" class="status"></div>
    </section>

    <section class="card">
      <div class="card-title">二、立刻寄送</div>

      <button
        id="sendNowBtn"
        class="send"
        type="button"
        onclick="sendNow()"
      >
        立即寄送進度報告
      </button>

      <div class="note">
        立刻寄送會立即產生目前進度報告並寄出。每個小組只會收到自己小組的進度。
      </div>

      <div class="decor-line"></div>
      <div id="sendStatus" class="status"></div>
    </section>
  </main>

  <script>
    const GAS_WEB_APP_URL =
      'https://script.google.com/macros/s/AKfycbyZjv5XvmzZ2GHBXBUzuwBbw9MR1LPkgbGfGLfjEgCVrT9WBoH3u1f60-8k-x_GBffQSg/exec';

    const MAIL_API_TIMEOUT_MS = 120000;

    document.addEventListener('DOMContentLoaded', function() {
      loadMailPageInit();
    });

    function callPortalAction(action, payload) {
      return new Promise(function(resolve, reject) {
        const requestId =
          'mailJsonp_' +
          Date.now() +
          '_' +
          Math.random().toString(36).slice(2);

        const script = document.createElement('script');
        let finished = false;
        let timer = null;

        function cleanup() {
          if (finished) {
            return;
          }

          finished = true;

          if (timer) {
            window.clearTimeout(timer);
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          try {
            delete window[requestId];
          } catch (err) {
            window[requestId] = undefined;
          }
        }

        window[requestId] = function(response) {
          cleanup();

          if (response && response.error) {
            reject(
              new Error(
                response.message || '後端處理失敗'
              )
            );
            return;
          }

          resolve(response || {});
        };

        script.onerror = function() {
          cleanup();

          reject(
            new Error(
              '無法連線至寄信系統，請確認 GAS 已重新部署。'
            )
          );
        };

        const params = new URLSearchParams();

        params.set('action', action);
        params.set('callback', requestId);

        if (payload && typeof payload === 'object') {
          params.set('payload', JSON.stringify(payload));
        }

        script.src =
          GAS_WEB_APP_URL +
          '?' +
          params.toString();

        timer = window.setTimeout(function() {
          cleanup();

          reject(
            new Error(
              '系統等待逾時。請查看 GAS 執行紀錄確認寄信是否完成。'
            )
          );
        }, MAIL_API_TIMEOUT_MS);

        document.head.appendChild(script);
      });
    }

    function loadMailPageInit() {
      setButtonBusy('saveBtn', false);
      setButtonBusy('deleteBtn', false);
      setButtonBusy('sendNowBtn', false);

      showStatus('scheduleStatus', '讀取設定中...', false);

      callPortalAction('getMailPageInitData')
        .then(function(data) {
          const hasSchedule = !!(data && data.hasSchedule);

          document.getElementById('dayOfWeek').value =
            hasSchedule ? (data.dayOfWeek || '') : '';

          document.getElementById('hour').value =
            hasSchedule ? String(data.hour || '') : '';

          if (hasSchedule) {
            showStatus(
              'scheduleStatus',
              '目前已有固定寄送排程。',
              false,
              true
            );
          } else {
            showStatus(
              'scheduleStatus',
              '目前沒有固定寄送排程。',
              false
            );
          }
        })
        .catch(function(error) {
          showStatus(
            'scheduleStatus',
            getErrorMessage(error),
            true
          );
        });
    }

    function saveSchedule() {
      const dayOfWeek =
        document.getElementById('dayOfWeek').value;

      const hour =
        document.getElementById('hour').value;

      if (!dayOfWeek) {
        showStatus('scheduleStatus', '請選擇星期', true);
        return;
      }

      if (hour === '') {
        showStatus('scheduleStatus', '請選擇時間', true);
        return;
      }

      setButtonBusy('saveBtn', true, '儲存中...');
      showStatus('scheduleStatus', '儲存中...', false);

      callPortalAction('saveMailSchedule', {
        dayOfWeek: dayOfWeek,
        hour: hour
      })
        .then(function(result) {
          showStatus(
            'scheduleStatus',
            result.message || '已儲存固定寄送時間',
            false,
            true
          );
        })
        .catch(function(error) {
          showStatus(
            'scheduleStatus',
            getErrorMessage(error),
            true
          );
        })
        .finally(function() {
          setButtonBusy('saveBtn', false);
        });
    }

    function deleteSchedule() {
      setButtonBusy('deleteBtn', true, '刪除中...');
      showStatus('scheduleStatus', '刪除中...', false);

      callPortalAction('deleteMailSchedule')
        .then(function(result) {
          document.getElementById('dayOfWeek').value = '';
          document.getElementById('hour').value = '';

          showStatus(
            'scheduleStatus',
            result.message || '已刪除固定寄送時間',
            false,
            true
          );
        })
        .catch(function(error) {
          showStatus(
            'scheduleStatus',
            getErrorMessage(error),
            true
          );
        })
        .finally(function() {
          setButtonBusy('deleteBtn', false);
        });
    }

    function sendNow() {
      setButtonBusy('sendNowBtn', true, '寄送中...');
      showStatus('sendStatus', '寄送中...', false);

      callPortalAction('sendReportNow')
        .then(function(result) {
          const sentCount = Number(result.sentCount || 0);
          const failedCount = Number(result.failedCount || 0);

          let message =
            result.message ||
            ('已完成寄送，寄送人數：' + sentCount);

          if (failedCount > 0) {
            message += '\n未寄出：' + failedCount + ' 封';

            if (result.failedDetails) {
              message += '\n' + result.failedDetails;
            }

            showStatus('sendStatus', message, true);
            return;
          }

          showStatus('sendStatus', message, false, true);
        })
        .catch(function(error) {
          showStatus(
            'sendStatus',
            getErrorMessage(error),
            true
          );
        })
        .finally(function() {
          setButtonBusy('sendNowBtn', false);
        });
    }

    function setButtonBusy(id, isBusy, busyText) {
      const button = document.getElementById(id);

      if (!button) {
        return;
      }

      if (!button.dataset.defaultText) {
        button.dataset.defaultText = button.textContent.trim();
      }

      button.disabled = !!isBusy;

      button.textContent = isBusy
        ? (busyText || button.dataset.defaultText)
        : button.dataset.defaultText;
    }

    function getErrorMessage(error) {
      if (!error) {
        return '系統發生未知錯誤';
      }

      if (typeof error === 'string') {
        return error;
      }

      if (error.message) {
        return String(error.message);
      }

      return String(error);
    }

    function showStatus(id, message, isError, isSuccess) {
      const el = document.getElementById(id);

      el.textContent = message || '';

      if (isError) {
        el.className = 'status error';
      } else if (isSuccess) {
        el.className = 'status success';
      } else {
        el.className = 'status';
      }
    }
  </script>
</body>
</html>
